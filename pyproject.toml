[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diskdedupe"
version = "0.1.0"
description = "Find duplicate files by content and quarantine redundant copies with a restorable manifest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "diskdedupe contributors" }]
keywords = ["duplicates", "disk-space", "cli", "deduplication", "files"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
diskdedupe = "diskdedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
